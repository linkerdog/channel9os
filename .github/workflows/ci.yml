name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Build firmware
        run: cargo build
