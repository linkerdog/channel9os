name: Host Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  channel9-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Check runtime tests
        run: cargo test -p channel9-runtime --target x86_64-unknown-linux-gnu
