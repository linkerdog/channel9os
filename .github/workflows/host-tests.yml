name: Host Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  channel9-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: Check runtime tests
        run: cargo +nightly test -p channel9-runtime --target x86_64-unknown-linux-gnu
